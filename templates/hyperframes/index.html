<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HyperFrames Demo Animation</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #111;
      }

      [data-composition-id] {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #f7f4ef;
        color: #1d1d1f;
        font-family: Inter, Arial, sans-serif;
      }
    </style>
  </head>
  <body>
    <main
      data-composition-id="demo-animation"
      data-width="1920"
      data-height="1080"
      data-duration="10"
      data-fps="30"
    >
      <section id="stage">Demo animation preview</section>
    </main>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["demo-animation"] = {
        seek(time) {
          document.getElementById("stage").style.opacity = String(Math.min(1, time / 1));
        }
      };
    </script>
  </body>
</html>
